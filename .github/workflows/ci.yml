name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: solarcrm
          POSTGRES_PASSWORD: solarcrm
          POSTGRES_DB: solarcrm
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U solarcrm" --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://solarcrm:solarcrm@localhost:5432/solarcrm?schema=public
      JWT_SECRET: ci-only-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:shared
      - run: pnpm --filter @solarcrm/api exec prisma generate
      - run: pnpm typecheck
      - run: pnpm --filter @solarcrm/shared test
      - run: pnpm --filter @solarcrm/api db:deploy
      - run: pnpm --filter @solarcrm/api db:seed
      - run: pnpm --filter @solarcrm/api test
      - run: pnpm --filter @solarcrm/web build
