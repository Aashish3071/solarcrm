# Local infrastructure for development only. Credentials here are dev defaults.
# Object storage (documents/photos) is added in Phase 1; provider is open point 14.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: solarcrm
      POSTGRES_PASSWORD: solarcrm
      POSTGRES_DB: solarcrm
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U solarcrm"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  pgdata:
