<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Solar CRM Wireframes</title>
<style>
:root{--bg:#f8f9fb;--card:#fff;--ink:#111827;--mute:#5f6b7a;--line:#e5e8ed;--blue:#1d4ed8;--blue-d:#1a43b8;--blue-s:#e8effd;--red:#c81e1e;--red-s:#fdecec;--grn:#15803d;--grn-s:#e2f6e9;--amb:#a16207;--amb-s:#fdf3c8;--nav:#f1f3f6;--focus:#1d4ed8}
*{box-sizing:border-box}
body{margin:0;font:14px/1.5 "Inter",-apple-system,"Segoe UI",system-ui,sans-serif;color:var(--ink);background:var(--bg);height:100vh;display:flex;flex-direction:column;overflow:hidden}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.skip{position:absolute;left:-999px}.skip:focus{left:8px;top:8px;background:#fff;padding:6px 10px;z-index:99}
/* top bar */
.top{height:64px;flex:0 0 64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px}
.top .l,.top .r{display:flex;align-items:center;gap:14px}
.ib{width:40px;height:40px;border:0;background:transparent;border-radius:8px;display:grid;place-items:center;color:#374151;cursor:pointer;padding:0}
.ib:hover{background:var(--nav)}.ib svg{width:20px;height:20px;fill:currentColor}
.logo{width:34px;height:34px;border-radius:50%;background:#f5c518;display:grid;place-items:center}
.logo svg{width:20px;height:20px;fill:#1f2937}
.bname{font-weight:700;font-size:16px}
.badge{position:relative}.badge i{position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;background:var(--red);border:2px solid #fff}
.frame{flex:1;display:flex;min-height:0}
aside{width:260px;flex:0 0 260px;background:#fff;border-right:1px solid var(--line);overflow:auto;padding:14px 12px;display:flex;flex-direction:column}
aside.hide{display:none}
aside a{display:block;padding:11px 16px;margin:2px 0;border-radius:8px;color:#1f2937;text-decoration:none;font-size:14.5px}
aside a:hover{background:var(--nav)}aside a[aria-current=page]{background:var(--nav);font-weight:600}
aside hr{border:0;border-top:1px solid var(--line);margin:10px 4px}
aside .lg{margin-top:auto}
main{flex:1;overflow:auto;padding:28px 32px 100px;min-width:0}
.in{max-width:1240px;margin:auto}
h1{font-size:26px;line-height:1.2;margin:0;font-weight:700}.lead{color:var(--mute);margin:4px 0 0}
.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:22px}
.acts{display:flex;gap:10px;flex-wrap:wrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:20px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
.card h3{margin:0 0 14px;font-size:17px;font-weight:600}
.card h4{margin:0 0 10px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);font-weight:500}
.grid{display:grid;gap:20px}.g2{grid-template-columns:repeat(auto-fit,minmax(320px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.kpi{padding:18px 20px}.kpi h4{margin:0}.kpi b{display:block;font-size:30px;font-weight:600;margin-top:8px}.kpi .g{color:var(--grn)}.kpi .r{color:var(--red)}.kpi .b{color:var(--blue)}
.kpi.tri{display:flex;flex-wrap:wrap;gap:22px 30px}.kpi.tri>div b{font-size:26px;margin-top:2px}.kpi.tri>div span{color:var(--mute);font-size:13px}.kpi.tri h4{flex:0 0 100%}
label{display:block;font-size:13px;color:#374151;margin:14px 0 5px;font-weight:500}
input,select,textarea{width:100%;padding:9px 12px;border:1px solid #cfd5dd;border-radius:8px;background:#fff;color:var(--ink);font:inherit;min-height:42px}
input:disabled,select:disabled{background:#f1f3f6;color:#8b94a1}
button,.btn{font:inherit;font-weight:500;min-height:42px;padding:8px 18px;border-radius:8px;border:1px solid #cfd5dd;background:#fff;color:var(--ink);cursor:pointer}
button:hover{background:var(--nav)}button.pri{background:var(--blue);color:#fff;border-color:var(--blue)}button.pri:hover{background:var(--blue-d)}button:disabled{opacity:.5;cursor:not-allowed}
button.sm{min-height:34px;padding:4px 12px;font-size:13px}
.lnk{color:var(--blue);text-decoration:none;font-weight:500;background:none;border:0;padding:0;min-height:0;cursor:pointer}.lnk:hover{text-decoration:underline;background:none}
table{width:100%;border-collapse:collapse}th{font-size:12px;letter-spacing:.05em;text-transform:uppercase;color:var(--mute);text-align:left;font-weight:500;padding:12px 14px;border-bottom:1px solid var(--line);background:#fafbfc}
td{padding:15px 14px;border-bottom:1px solid var(--line);vertical-align:middle}tr:last-child td{border-bottom:0}
.tbl{overflow:auto;border:1px solid var(--line);border-radius:10px}
.pill{display:inline-block;padding:2px 12px;border-radius:999px;font-size:12.5px;font-weight:500;background:#eef0f3;color:#374151}
.pill.b{background:var(--blue-s);color:#1e40af}.pill.g{background:var(--grn-s);color:var(--grn)}.pill.a{background:var(--amb-s);color:var(--amb)}.pill.r{background:var(--red-s);color:var(--red)}
.tabs{display:flex;gap:24px;border-bottom:1px solid var(--line);margin-bottom:20px;flex-wrap:wrap}
.tabs a{padding:10px 2px;color:var(--mute);text-decoration:none;border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500}
.tabs a.on{color:var(--blue);border-color:var(--blue)}
.note{padding:11px 14px;border-radius:8px;background:var(--blue-s);color:#1e3a8a;font-size:13.5px;margin-top:14px}.note.err{background:var(--red-s);color:var(--red)}.note.ok{background:var(--grn-s);color:var(--grn)}
.bar{height:8px;border-radius:4px;background:#e9ecf0;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue)}.bar.gr i{background:#22c55e}
.row{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin:12px 0 4px}.row span:last-child{color:var(--mute)}
.list{list-style:none;margin:0;padding:0}
.fu{background:var(--red-s);border-radius:8px;padding:11px 14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}
.fu b{display:block}.fu small{color:var(--red)}
.kan{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(250px,1fr);gap:16px;overflow:auto;padding-bottom:8px}
.col{background:#eef0f3;border-radius:12px;padding:14px;min-height:220px}
.col h4{display:flex;justify-content:space-between;align-items:center;color:#1f2937;font-weight:600;margin-bottom:12px}.col h4 span{background:#dde1e7;border-radius:999px;padding:0 9px;font-size:12px}
.lc{background:#fff;border-radius:10px;padding:12px 14px;margin-bottom:10px;border:1px solid var(--line)}.lc b{display:block}.lc small{color:var(--mute)}.lc div{display:flex;justify-content:space-between;margin-top:8px;font-size:13px}
.pc{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px}.pc header{display:flex;justify-content:space-between;gap:8px;margin-bottom:8px}.pc header b{font-size:16px}
.pc p{margin:2px 0;color:#374151;font-size:14px}
.stg{display:flex;gap:6px;flex-wrap:wrap}.stg span{font-size:12.5px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--mute);background:#fff}
.stg .d{background:#111827;color:#fff;border-color:#111827}.stg .c{background:var(--amb-s);color:var(--amb);border-color:#f1d669;font-weight:600}
.settings{display:grid;grid-template-columns:230px 1fr;gap:20px}@media(max-width:800px){.settings{grid-template-columns:1fr}}
.sm-menu{background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px;align-self:start}
.sm-menu a{display:block;padding:11px 14px;border-radius:8px;color:#1f2937;text-decoration:none}.sm-menu a.on{background:var(--blue-s);color:var(--blue);font-weight:600;box-shadow:inset 3px 0 var(--blue)}
.phone{max-width:380px;border:1px solid var(--line);border-radius:18px;padding:18px;background:#fff;margin:auto}
.chk{display:flex;gap:10px;align-items:center}.chk input{width:18px;height:18px;min-height:0}
.fab{position:fixed;right:24px;bottom:24px;width:54px;height:54px;border-radius:50%;background:var(--blue);color:#fff;border:0;display:grid;place-items:center;padding:0;box-shadow:0 4px 14px rgba(29,78,216,.35);z-index:20}
.fab:hover{background:var(--blue-d)}.fab svg{width:24px;height:24px;fill:#fff}
.ai{position:fixed;right:0;top:0;height:100vh;width:410px;max-width:100vw;background:#fff;border-left:1px solid var(--line);box-shadow:-10px 0 30px rgba(0,0,0,.1);z-index:30;display:none;flex-direction:column}
.ai.open{display:flex}.ai header{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.ai header b{font-size:16px}.ai .body{flex:1;overflow:auto;padding:18px 20px}.ai .foot{padding:14px;border-top:1px solid var(--line);display:flex;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.chips button{border-radius:999px;font-size:13px;min-height:36px;padding:4px 14px;background:var(--blue-s);color:#1e40af;border-color:#c9d8fb}
.bub{padding:11px 14px;border-radius:12px;margin:10px 0;max-width:94%}.bub.u{background:var(--blue);color:#fff;margin-left:auto}.bub.a{background:#f1f3f6}
.small{font-size:12.5px;color:var(--mute)}
@media(max-width:820px){aside{position:fixed;z-index:15;top:64px;bottom:0;box-shadow:4px 0 20px rgba(0,0,0,.1)}main{padding:20px 16px 100px}}
</style>
</head>
<body>
<a class="skip" href="#main">Skip to content</a>
<header class="top">
  <div class="l">
    <button class="ib" id="menu" aria-label="Toggle navigation" aria-expanded="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16v2H4zM4 11h10v2H4zM4 16h16v2H4z"/></svg></button>
    <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M11 1h2v4h-2zM11 19h2v4h-2zM1 11h4v2H1zM19 11h4v2h-4zM4.2 5.6l1.4-1.4 2.8 2.8-1.4 1.4zM15.6 17l1.4-1.4 2.8 2.8-1.4 1.4zM5.6 19.8l-1.4-1.4L7 15.6l1.4 1.4zM17 8.4 15.6 7l2.8-2.8L19.8 5.6z"/></svg></div>
    <span class="bname">Solar CRM</span>
  </div>
  <div class="r">
    <button class="ib badge" aria-label="Notifications, 3 unread"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22a2.5 2.5 0 0 0 2.4-2h-4.8A2.5 2.5 0 0 0 12 22zm7-6V11a7 7 0 0 0-5-6.7V3a2 2 0 0 0-4 0v1.3A7 7 0 0 0 5 11v5l-2 2v1h18v-1z"/></svg><i></i></button>
    <a class="ib" href="#set" aria-label="Settings"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19.4 13a7.6 7.6 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7.5 7.5 0 0 0-1.7-1L15 3.3h-4l-.4 2.6a7.5 7.5 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.6 7.6 0 0 0 0 2l-2.1 1.6 2 3.5 2.5-1a7.5 7.5 0 0 0 1.7 1l.4 2.6h4l.4-2.6a7.5 7.5 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5a3.5 3.5 0 1 1 0-7 3.5 3.5 0 0 1 0 7z" transform="translate(-1 0)"/></svg></a>
  </div>
</header>
<div class="frame">
<aside id="side" aria-label="Primary"><nav id="nav" aria-label="Main navigation"></nav></aside>
<main id="main" tabindex="-1"><div class="in" id="view"></div></main>
</div>

<button class="fab" id="fab" aria-label="Open AI Advisor" aria-controls="ai" aria-expanded="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H9l-5 4v-4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z"/></svg></button>
<section class="ai" id="ai" role="dialog" aria-label="AI Advisor">
  <header><div><b>AI Advisor</b><div class="small">Answers only from data you can access</div></div><button class="ib" id="x" aria-label="Close AI Advisor"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6.4 5 5 6.4 10.6 12 5 17.6 6.4 19l5.6-5.6 5.6 5.6 1.4-1.4-5.6-5.6L19 6.4 17.6 5 12 10.6z"/></svg></button></header>
  <div class="body" id="chat">
    <div class="bub a">Hi Aarav. I can summarise a project, find leads, spot delays or draft a message. I never change anything without your confirmation.</div>
    <div class="chips" id="chips">
      <button data-q="Summarise SLR-2026-00123">Summarise a project</button>
      <button data-q="Find leads not contacted in 3 days">Find stale leads</button>
      <button data-q="Which projects are at risk of delay?">At-risk projects</button>
      <button data-q="Draft a follow-up to Ramesh Kumar">Draft a message</button>
      <button data-q="What is waiting on Accounts?">Waiting on Accounts</button>
    </div>
  </div>
  <form class="foot" id="af"><input id="aq" aria-label="Ask the AI Advisor" placeholder="Ask about your leads or projects"><button class="pri">Send</button></form>
</section>

<script>
const NAV=[["dash","Dashboard"],["work","My Work"],["leads","Leads"],["visit","Site Visits"],["final","Finalize & Advance"],["projects","Projects"],["init","Project Initiation"],["plan","Planning & Material"],["inst","Installation & Completion"],["gov","Government Registration"],["loan","Loan Processing"],["discom","DISCOM"],["pay","Payments"],["inc","Incentives"],["portal","Customer Portal"],["auto","Automation"],["set","Settings"]];
const T={};
const step=["Lead","Requirement","Supervisor assigned","Visit scheduled","Visit done","Sales finalization","Customer confirmed","Advance logged","Payment verified","Project initiated","Gov registration","Loan","DISCOM","Site revisit & design","Planning","Ready to dispatch","Dispatched","Received at site","Installation","Completion","Final DISCOM","Payment collection","Incentive"];
const stg=c=>`<div class="stg" role="list" aria-label="Stage ${c} of 23">${step.map((s,i)=>`<span role="listitem" class="${i<c-1?'d':i==c-1?'c':''}">${i+1}. ${s}</span>`).join('')}</div>`;
const head=(t,s,a='')=>`<div class="head"><div><h1>${t}</h1><p class="lead">${s}</p></div><div class="acts">${a}</div></div>`;
const tabs=(a,on=0)=>`<div class="tabs">${a.map((x,i)=>`<a href="javascript:void 0" class="${i==on?'on':''}">${x}</a>`).join('')}</div>`;
const k=(t,v,c='')=>`<div class="card kpi"><h4>${t}</h4><b class="${c}">${v}</b></div>`;

T.dash=()=>head("Dashboard","Welcome back, Aarav. Here's your overview.",'<button class="pri" onclick="location.hash=\'leads\'">Leads</button><button onclick="location.hash=\'visit\'">Site Visits</button>')+`
<div class="grid g4">${k("My leads","6")}${k("Active projects","4")}${k("Collections","₹1,66,320")}${k("Open SLA breaches","3","r")}</div>
<div class="grid g3">
 <div class="card kpi tri"><h4>Today</h4><div><b>2</b><span>New leads</span></div><div><b>9</b><span>Follow-ups due</span></div><div><b>5</b><span>Payments to verify</span></div></div>
 <div class="card kpi tri"><h4>This week</h4><div><b>11</b><span>New leads</span></div><div><b>3</b><span>Projects started</span></div><div><b>22%</b><span>Conversion</span></div></div>
 <div class="card kpi tri"><h4>This month</h4><div><b>7</b><span>Installed</span></div><div><b>₹48L</b><span>Booked</span></div><div><b>₹2.1L</b><span>Incentive</span></div></div></div>
<div class="grid" style="grid-template-columns:2fr 1fr">
 <div class="card"><h3>Project pipeline</h3>${[["Lead & requirement",6],["Site visit",3],["Sales finalization",2],["Payment verification",5],["Gov · DISCOM · Loan",4],["Installation",2]].map(([n,v])=>`<div class="row"><span>${n}</span><span>${v}</span></div><div class="bar"><i style="width:${v*14}%"></i></div>`).join('')}</div>
 <div class="card"><h3>Overdue follow-ups</h3>
  <div class="fu"><div><b>Suresh Gupta</b><small>Due: 07 Sep</small></div><button class="lnk">View</button></div>
  <div class="fu"><div><b>Akash Patil</b><small>Due: 07 Sep</small></div><button class="lnk">View</button></div>
  <div class="fu"><div><b>Maya Sexton</b><small>Due: 06 Sep</small></div><button class="lnk">View</button></div></div></div>`;

T.work=()=>head("My Work","Tasks, follow-ups and SLA clocks assigned to you.")+`<div class="grid g4">${k("Overdue","2","r")}${k("Due today","9")}${k("Completed today","5","g")}${k("Next 7 days","18")}</div>
<div class="tbl card" style="padding:0"><table><thead><tr><th>Due</th><th>Task</th><th>Source</th><th>SLA</th><th>Actions</th></tr></thead><tbody>
<tr><td>11:00</td><td><button class="lnk">Call Ramesh Kumar (new lead)</button></td><td><span class="pill b">Auto follow-up</span></td><td><span class="pill a">1h 20m left</span></td><td><button class="sm">Done</button> <button class="sm">Snooze</button></td></tr>
<tr><td>—</td><td><button class="lnk">Verify advance SLR-…123</button></td><td><span class="pill b">Auto-assigned</span></td><td><span class="pill r">Breached 2h</span></td><td><button class="sm pri">Open</button></td></tr>
<tr><td>Today</td><td><button class="lnk">Schedule visit SLR-…131</button></td><td><span class="pill b">Auto-assigned</span></td><td><span class="pill g">5h left</span></td><td><button class="sm pri">Accept</button> <button class="sm">Reassign</button></td></tr></tbody></table></div>`;

const lc=(n,kw,loc,o)=>`<div class="lc"><b>${n}</b><small>${kw} kW · ${o}</small><div><span>${loc}</span><button class="lnk">View Details</button></div></div>`;
T.leads=()=>head("Leads","Every enquiry from Direct and Sales Partner sources.",'<input aria-label="Search leads" placeholder="Search leads…" style="width:240px"><button class="pri" onclick="document.getElementById(\'nl\').scrollIntoView({behavior:\'smooth\'})">New Lead</button>')+
tabs(["Kanban View","List View"])+`<div class="kan">
<div class="col"><h4>1. Lead created <span>1</span></h4>${lc("Priya Nair",3,"Pune","Direct")}</div>
<div class="col"><h4>2. Requirement captured <span>2</span></h4>${lc("Ramesh Kumar",5,"Delhi","Direct")}${lc("Meera Shah",10,"Mumbai","Sun&Co")}</div>
<div class="col"><h4>3. Supervisor assigned <span>1</span></h4>${lc("Amit Verma",6,"Nagpur","Direct")}</div>
<div class="col"><h4>4. Visit scheduled <span>1</span></h4>${lc("Suresh Gupta",3,"Delhi","BrightLeads")}</div>
<div class="col"><h4>5. Visit completed <span>1</span></h4>${lc("Akash Patil",3,"Mumbai","Direct")}</div></div>
<div class="card" id="nl" style="margin-top:28px"><h3>New lead and requirement</h3><div class="grid g2"><div>
<label for="src">Lead source *</label><select id="src"><option value="d">Direct Source</option><option value="p">Sales Partner</option></select>
<div id="pt" hidden><label for="ptn">Partner *</label><select id="ptn"><option>Sun&amp;Co (Full Sales Partner)</option><option>BrightLeads (Lead only)</option></select></div>
<label for="cn">Customer name *</label><input id="cn"><label for="ph">Phone *</label><input id="ph" inputmode="tel"><label for="ad">Installation address *</label><input id="ad"></div><div>
<label for="kw">Required capacity (kW) *</label><input id="kw" type="number" value="5"><label for="ln">Loan needed</label><select id="ln"><option>No</option><option>Yes</option></select>
<label for="pty">Project type *</label><select id="pty"><option>Residential</option><option>Commercial</option></select><label for="pk">Package *</label><select id="pk"><option value="55000">Standard</option><option value="60000">Premium</option></select>
<div class="note" id="pp" aria-live="polite"></div></div></div><p style="margin-top:18px"><button>Save draft</button> <button class="pri">Save and auto-assign</button></p></div>`;

T.visit=()=>head("Site Visits","Assign, schedule and record site assessments.")+`<div class="card" style="padding:14px"><div class="grid g3"><input aria-label="Search by customer" placeholder="Search by customer name…"><select aria-label="Status"><option>All statuses</option></select><select aria-label="Supervisor"><option>All supervisors</option></select></div></div>
<div class="tbl card" style="padding:0"><table><thead><tr><th>Customer</th><th>Visit date / time</th><th>Supervisor</th><th>Status</th><th>Actions</th></tr></thead><tbody>
<tr><td><button class="lnk">Sneha Kulkarni</button></td><td>2026-09-22 10:00</td><td>Amit</td><td><span class="pill g">Completed</span></td><td><button class="sm pri">View assessment</button></td></tr>
<tr><td><button class="lnk">Ramesh Kumar</button></td><td>2026-09-24 16:54</td><td>Amit</td><td><span class="pill b">Scheduled</span></td><td><button class="sm pri">Start visit</button></td></tr>
<tr><td><button class="lnk">Amit Verma</button></td><td>Not scheduled</td><td>Unassigned</td><td><span class="pill a">Needs supervisor</span></td><td><button class="sm">Assign (suggested: Amit)</button></td></tr></tbody></table></div>
<div class="grid g2"><div class="card"><h3>Schedule visit</h3><label for="vd">Visit time *</label><select id="vd"><option value="4">Within 24 hours</option><option value="30">More than 24 hours from assignment</option></select>

function tog(o){ai.classList.toggle('open',o);fab.setAttribute('aria-expanded',o);if(o)$('aq').focus();else fab.focus()}
fab.onclick=()=>tog(!ai.classList.contains('open'));$('x').onclick=()=>tog(false);
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ai.classList.contains('open'))tog(false)});

function ask(q){const c=$('chat');$('chips').style.display='none';const u=document.createElement('div');u.className='bub u';u.textContent=q;c.appendChild(u);
 const key=Object.keys(ans).find(k=>q.toLowerCase().includes(k));c.insertAdjacentHTML('beforeend',`<div class="bub a">${key?ans[key]:"I can help with summaries, finding leads, delay risks and drafts. Try one of the suggestions."}</div>`);c.scrollTop=c.scrollHeight}
document.querySelectorAll('#chips button').forEach(b=>b.onclick=()=>ask(b.dataset.q));
$('af').onsubmit=e=>{e.preventDefault();if($('aq').value.trim()){ask($('aq').value);$('aq').value=''}};
